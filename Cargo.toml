[package]
name = "tasqer"
version = "0.1.0"
edition = "2024"

[dependencies]
rkt = { version = "1.2.0", features = ["json", "uuid"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls-ring", "postgres", "chrono", "uuid"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros"] }
anyhow = "1.0.104"
uuid = { version = "1.28.0", features = ["serde", "v7"] }
rand = "0.10.3"
base64 = "0.23.1"
dotenvy = "0.15.7"
argon2 = "0.6.0"
serde = "1.0.229"
chrono = { version = "0.4.45", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
