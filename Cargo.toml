[package]
name = "tasqer"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls-ring", "postgres", "time", "uuid"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros"] }
anyhow = "1.0.104"
uuid = "1.28.0"
dotenvy = "0.15.7"
argon2 = "0.6.0"
serde = "1.0.229"
serde_json = "1.0.154"